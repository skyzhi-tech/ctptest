[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctptest"
version = "0.1.0"
description = "CTP 穿透式监管测试桌面工具"
requires-python = ">=3.12"
dependencies = ["exsdk==1.7"]

[project.gui-scripts]
ctptest = "ctptest.gui:main"

[tool.setuptools.packages.find]
include = ["ctptest*"]
